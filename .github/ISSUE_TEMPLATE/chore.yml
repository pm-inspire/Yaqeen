name: Chore / maintenance
description: Tech debt, refactors, tooling, docs, etc.
title: "[Chore]: "
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Maintenance / refactor
        - Tooling / CI
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: What needs to be done?
      description: Describe the work and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
