name: Bug report
description: Report something broken
title: "[Bug]: "
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below so we can reproduce and fix it quickly.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 (blocking)
        - P1 (high)
        - P2 (medium)
        - P3 (low)
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened? What did you expect?
      placeholder: "When I..., I expected..., but..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide exact steps, minimal repro if possible.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs (please redact secrets).
      render: shell
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, version, runtime, etc.
      placeholder: "Ubuntu 22.04, Node 20.11, ..."
    validations:
      required: false
