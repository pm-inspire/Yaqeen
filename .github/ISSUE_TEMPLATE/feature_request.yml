name: Feature request
description: Propose a new feature or enhancement
title: "[Feature]: "
labels:
  - "enhancement"
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 (must-have)
        - P1 (high)
        - P2 (medium)
        - P3 (low)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem are you trying to solve? Who is it for?
      placeholder: "As a ..., I want ..., so that ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should we build? Include UX/API ideas if relevant.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist of conditions for completion.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why not.
    validations:
      required: false
